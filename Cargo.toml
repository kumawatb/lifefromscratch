[package]
name = "lifefromscratch"
description = "A program to simulate artificial chemistries in a 2D world"
version = "1.0.0"
edition = "2021"

[dependencies]
ahash = "0.8.11"
avian2d = "0.2.1"
bevy = "0.15.3"
#bevy_rapier2d = { version = "0.29.0", features = ["simd-stable", "parallel" ] }
clap = { version = "4.5.29", features = ["derive"] }
colorgrad = "0.7.0"
itertools = "0.14.0"
petgraph = "0.8.1"
rand = "0.9.0"
rand_xoshiro = "0.7.0"
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
# codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
# lto = "thin"

# Optimize for size in the wasm-release profile to reduce load times and bandwidth usage on web.
[profile.wasm-release]
# Default to release profile values.
inherits = "release"
# Optimize with size in mind (also try "z", sometimes it is better).
# Slightly slows compile times, great improvements to file size and runtime performance.
opt-level = "s"
# Strip all debugging information from the binary to slightly reduce file size.
strip = "debuginfo"

[package.metadata.packager]
product-name = "lifefromscratch"
identifier = "io.github.kumawatb.lifefromscratch"
version = "1.0.0"
category = "education"
long_description = """
This project is aimed at simulating an artificial 2D chemistry consisting of “atoms” that interact with each other based on arbitrary reaction rules. The goal is to model the emergence of self-replicating entities in a somewhat physics-y world.
"""
authors = ["Bhaskar Kumawat <kumawatb@umich.edu>"]
copyright = "Copyright (c) Bhaskar Kumawat 2025. All rights reserved."
icons = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png"]
resources = ["assets"]


